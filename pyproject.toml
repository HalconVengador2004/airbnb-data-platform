[build-system]
requires = ["setuptools>=63"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb-analytics"
version = "0.1.0"
description = "Analytics platform for Inside Airbnb listings in Madrid and Euskadi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]
dbt = [
    "dbt-core==1.11.17",
    "dbt-postgres==1.11.0",
]

[project.scripts]
airbnb-pipeline = "airbnb_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a running PostgreSQL instance",
]
addopts = "-ra"
