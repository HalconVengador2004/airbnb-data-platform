version: 2

sources:
  - name: raw
    description: >
      Immutable source layer loaded by the Python ingestion pipeline. Every
      source column is stored as TEXT, plus pipeline-owned ingestion metadata.
    schema: raw
    tables:
      - name: listings
        description: >
          Inside Airbnb listing snapshots for Madrid and Euskadi. One row per
          (_city, scrape_id, id). Values are preserved exactly as published.
        columns:
          - name: id
            description: Listing identifier from the source snapshot.
            data_tests:
              - not_null
          - name: scrape_id
            description: Snapshot identifier; exactly one per source file.
            data_tests:
              - not_null
          - name: _city
            description: Pipeline-owned city or region label (madrid, euskadi).
            data_tests:
              - not_null
          - name: _source_file
            description: Pipeline-owned source CSV filename.
            data_tests:
              - not_null
          - name: _file_hash
            description: Pipeline-owned SHA-256 hash of the source file.
            data_tests:
              - not_null
          - name: _loaded_at
            description: Pipeline-owned timestamp when the snapshot was loaded.
            data_tests:
              - not_null
          - name: price
            description: Raw price text as published, including the currency marker.
          - name: bathrooms_text
            description: Raw bathroom description, including shared/private and half-bath wording.
          - name: amenities
            description: Raw JSON array text of listing amenities.
          - name: license
            description: Raw license text as published.
